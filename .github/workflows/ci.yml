name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check custom_components/ tests/
      - run: ruff format --check custom_components/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - name: Install requirements of the bluetooth stack
        run: |
          python - <<'PY' > bluetooth-requirements.txt
          import json, pathlib, homeassistant
          components = pathlib.Path(homeassistant.__file__).parent / "components"
          for name in ("bluetooth", "bluetooth_adapters", "esphome", "usb"):
              manifest = json.loads((components / name / "manifest.json").read_text())
              print("\n".join(manifest.get("requirements", [])))
          PY
          pip install -r bluetooth-requirements.txt
      - run: pip list | grep -E "^(homeassistant|pytest-homeassistant-custom-component) "
      - run: pytest tests/ -v --timeout=30
